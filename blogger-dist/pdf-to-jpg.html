<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Ade3b16/pdf-tools@v1.0.0/shared/tools.css" />

<div id="pdf-tool-app">
  <nav class="pdf-tool-nav" aria-label="Tool navigation">
    <a href="/p/pdf-tools.html" class="back-link">← All Tools</a>
  </nav>

  <header class="tool-header">
    <h1 class="tool-title">PDF to JPG / PNG</h1>
    <p class="tool-subtitle">
      Render PDF pages as JPG or PNG image files at selectable resolution and quality.
    </p>
  </header>

  <main class="tool-workspace">
    <section class="tool-panel" aria-label="Select PDF file">
      <div
        id="pdf2img-dropzone"
        class="dropzone"
        role="button"
        tabindex="0"
        aria-label="Drop a PDF file here or click to select a file"
      >
        <h2 class="dropzone-title">Drop a PDF file here, or click to select</h2>
        <p class="dropzone-hint">Accepts a single .pdf file.</p>
        <span class="dropzone-btn">Select PDF File</span>
        <input
          type="file"
          id="pdf2img-file-input"
          class="sr-only-input"
          accept=".pdf,application/pdf"
        />
      </div>
    </section>

    <div id="pdf2img-status" class="status-banner info" hidden></div>

    <section id="pdf2img-config-panel" class="tool-panel" hidden aria-label="Image export settings">
      <div class="file-list-header" style="margin-bottom: 16px;">
        <div class="file-item" style="width: 100%;">
          <div class="file-item-info">
            <div class="file-item-details">
              <div id="pdf2img-file-name" class="file-item-name">document.pdf</div>
              <div id="pdf2img-file-meta" class="file-item-meta">0 KB • 0 pages</div>
            </div>
          </div>
          <div class="file-item-actions">
            <button type="button" id="pdf2img-change-file-btn" class="secondary-btn">Change File</button>
          </div>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="pdf2img-format" class="form-label">Format</label>
          <select id="pdf2img-format" class="form-select">
            <option value="jpeg" selected>JPG</option>
            <option value="png">PNG</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pdf2img-scale" class="form-label">Resolution</label>
          <select id="pdf2img-scale" class="form-select">
            <option value="1.5">110 DPI (Standard)</option>
            <option value="2.0" selected>150 DPI (High)</option>
            <option value="3.0">220 DPI (Print)</option>
          </select>
        </div>

        <div id="pdf2img-quality-group" class="form-group">
          <label for="pdf2img-quality" class="form-label">JPG Quality</label>
          <div class="range-slider-row">
            <input type="range" id="pdf2img-quality" min="40" max="100" step="5" value="90" />
            <span id="pdf2img-quality-badge" class="range-value-badge">90%</span>
          </div>
        </div>

        <div class="form-group">
          <label for="pdf2img-range" class="form-label">Pages to Export</label>
          <input
            type="text"
            id="pdf2img-range"
            class="form-input"
            value="all"
            placeholder="all or e.g. 1-3, 5"
          />
          <span id="pdf2img-range-hint" class="form-hint">Enter "all" or custom page ranges.</span>
        </div>
      </div>

      <div class="action-bar" style="margin-top: 16px;">
        <button type="button" id="pdf2img-submit-btn" class="primary-btn">
          <span>Export Images</span>
        </button>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Ade3b16/pdf-tools@v1.0.0/shared/utils.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Ade3b16/pdf-tools@v1.0.0/pdf-to-jpg/pdf-to-jpg.js"></script>
