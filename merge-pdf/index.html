<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge PDF — Local Browser PDF Utility</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fafafa;
    }
  </style>
</head>
<body>

<!-- ================= BLOGGER PASTE START ================= -->
<link rel="stylesheet" href="../shared/tools.css" />

<div id="pdf-tool-app">
  <nav class="pdf-tool-nav" aria-label="Tool navigation">
    <a href="../index.html" class="back-link">← All Tools</a>
  </nav>

  <header class="tool-header">
    <h1 class="tool-title">Merge PDF</h1>
    <p class="tool-subtitle">
      Select two or more PDF files, set their sequence, and combine them into a single PDF.
    </p>
  </header>

  <main class="tool-workspace">
    <section class="tool-panel" aria-label="Select PDF files">
      <div
        id="merge-dropzone"
        class="dropzone"
        role="button"
        tabindex="0"
        aria-label="Drop PDF files here or click to select files"
      >
        <h2 class="dropzone-title">Drop PDF files here, or click to select</h2>
        <p class="dropzone-hint">Accepts multiple .pdf files.</p>
        <span class="dropzone-btn">Select PDF Files</span>
        <input
          type="file"
          id="merge-file-input"
          class="sr-only-input"
          accept=".pdf,application/pdf"
          multiple
        />
      </div>
    </section>

    <div id="merge-status" class="status-banner info" hidden></div>

    <section id="merge-queue-panel" class="tool-panel" hidden aria-label="Selected PDF files">
      <div class="file-list-header">
        <div class="section-title" style="margin-bottom: 0;">
          <span>Files to Merge</span>
          <span id="merge-file-count" class="file-count-badge">0 files</span>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button type="button" id="merge-add-more-btn" class="secondary-btn">+ Add Files</button>
          <button type="button" id="merge-clear-btn" class="danger-btn">Clear</button>
        </div>
      </div>

      <ul id="merge-file-list" class="file-list" aria-label="Ordered list of PDFs to merge"></ul>

      <div class="form-grid" style="margin-top: 16px;">
        <div class="form-group">
          <label for="merge-output-name" class="form-label">Output Filename</label>
          <input
            type="text"
            id="merge-output-name"
            class="form-input"
            value="merged-document.pdf"
            placeholder="merged-document.pdf"
          />
        </div>
      </div>

      <div class="action-bar" style="margin-top: 16px;">
        <button type="button" id="merge-submit-btn" class="primary-btn" disabled>
          <span>Merge PDFs</span>
        </button>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="../shared/utils.js"></script>
<script src="./merge-pdf.js"></script>
<!-- ================= BLOGGER PASTE END ================= -->

</body>
</html>
